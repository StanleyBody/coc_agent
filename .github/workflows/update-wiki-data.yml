# 每週從 Clash of Clans Fandom Wiki 抓取第六工人計算機與升級資訊的資料
# 資料有變動時開 PR（分支 auto/update-wiki-data），由人工確認後合併。
# 需先在 Settings → Actions → General 勾選
# 「Allow GitHub Actions to create and approve pull requests」
name: Update data from Wiki

on:
  schedule:
    - cron: '23 3 * * 1' # 每週一 03:23 UTC（台灣時間 11:23）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-wiki-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test parser
        run: python -m unittest discover -s scripts

      - name: Fetch data from Wiki
        run: |
          python scripts/update_sixth_builder_data.py
          python scripts/update_upgrade_data.py
          python scripts/update_translations.py

      - name: Test and build with new data
        run: |
          npm test
          npm run build

      - name: Show changes
        run: git diff --stat

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-wiki-data
          delete-branch: true
          add-paths: |
            src/data/sixth-builder.json
            src/data/upgrade-info.json
            src/data/zh-tw.json
          commit-message: 'chore: update data from Fandom Wiki'
          title: 'chore: update data from Fandom Wiki'
          body: |
            每週自動更新的資料有變動（Fandom Wiki 的第六工人計算機、升級資訊資料，以及遊戲內繁體中文名稱）。

            - 解析器測試、計算機測試與網站建置已通過
            - Claude 會自動審查，沒有問題就自動合併；不想自動合併時加上 `no-auto-merge` 標籤

            由 `.github/workflows/update-wiki-data.yml` 產生

      # workflow 開的 PR 不會觸發 pull_request 事件，主動呼叫 Claude 審查
      - name: Request Claude review
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh workflow run claude-review.yml --repo "$GITHUB_REPOSITORY" -f pr_number="$PR_NUMBER"
