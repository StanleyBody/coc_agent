<div class="sb-res sb-res-{{ r.resource }}">
    <div class="sb-res-head">{% if r.resource == "gold" %}🪙{% else %}💧{% endif %} {{ r.name }}</div>
    <dl>
        <dt>還缺</dt><dd class="sb-num sb-shortage">{{ r.shortage|floatformat:"0g" }}</dd>
        <dt>每小時產量</dt><dd class="sb-num">{{ r.rate|floatformat:"0g" }}</dd>
        <dt>採集器補足需要</dt><dd class="sb-time">{{ r.time_text }}</dd>
    </dl>
    {% if not r.capacity_ok %}
    <p class="sb-warn">⚠️ {{ r.storage_name }}升到上限仍無法容納單次最高費用 {{ r.max_single|floatformat:"0g" }}。</p>
    {% endif %}
</div>
